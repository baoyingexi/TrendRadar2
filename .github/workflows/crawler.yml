name: Hot News Crawler

on:
  schedule:
    # 每天北京时间早上 7:00 (UTC 23:00) 运行
    - cron: "0 23 * * *"
  workflow_dispatch:

# 添加权限设置，允许提交代码
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装 requirements.txt (包含了 requests, beautifulsoup4 等)
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Verify required files
        run: |
          echo "🔍 检查必需的配置文件..."
          if [ ! -f config/config.yaml ]; then
            echo "❌ 错误: config/config.yaml 文件不存在"
            exit 1
          fi
          # 检查 update.py 是否存在
          if [ ! -f update.py ]; then
            echo "❌ 错误: update.py 文件不存在"
            exit 1
          fi
          echo "✅ 配置文件检查通过"

      # ================================================================
      # 步骤 1: 先抓取生活数据 (天气/油价/双色球)
      # 逻辑：先准备好 data/data.json 数据文件
      # ================================================================
      - name: Run Life Data Updater (update.py)
        run: python update.py

      # ================================================================
      # 步骤 2: 再抓取新闻并生成网页 (main.py)
      # 逻辑：main.py 会生成 index.html，里面的 JS 代码会去读取上面的 data.json
      # ================================================================
      - name: Run News Crawler (main.py)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GITHUB_ACTIONS: true
        run: python main.py

      # ================================================================
      # 步骤 3: 一次性提交所有更改
      # 包括：data/data.json (新数据) 和 index.html (新页面)
      # ================================================================
      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          # 把所有变化的文件（json和html）都加入暂存区
          git add -A
          # 只有当有变化时才提交，防止报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: News & Life Data at $(TZ=Asia/Shanghai date)" && git push)
